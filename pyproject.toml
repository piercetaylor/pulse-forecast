[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-forecast"
version = "0.1.0"
description = "A small GRU forecasting experiment on public pulse-oximeter waveforms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy==2.3.5", "torch==2.9.1", "matplotlib==3.10.8"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.10"]

[project.scripts]
pulse-forecast = "pulse_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
